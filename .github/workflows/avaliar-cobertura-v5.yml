name: Avaliar cobertura territorial V5 experimental
on:
  push:
    branches: [experimento/modelo-territorial-999]
    paths:
      - 'experimentos/modelo_999/auditoria_integral/avaliar_cobertura_v5.py'
      - 'experimentos/modelo_999/auditoria_integral/protocolo_cobertura_territorial_v5.json'
      - '.github/workflows/avaliar-cobertura-v5.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute development comparison
        run: python experimentos/modelo_999/auditoria_integral/avaliar_cobertura_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-v5-desenvolvimento
          path: experimentos/modelo_999/auditoria_integral/resultado_cobertura_v5_desenvolvimento.json
