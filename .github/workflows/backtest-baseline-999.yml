name: Backtest baseline nacional isolado
on:
  push:
    branches: [experimento/modelo-territorial-999]
    paths:
      - '.github/workflows/backtest-baseline-999.yml'
      - 'experimentos/modelo_999/backtest_baseline_nacional.py'
      - 'experimentos/modelo_999/auditar_sincronismo_uf.py'
      - 'experimentos/modelo_999/auditar_staleness_uf.py'
      - 'experimentos/modelo_999/backtest_nowcast_uf.py'
      - 'experimentos/modelo_999/diagnosticar_primeiro_turno.py'
      - 'experimentos/modelo_999/backtest_primeiro_turno_uf.py'
      - 'experimentos/modelo_999/stress_primeiro_turno_uf.py'
      - 'experimentos/modelo_999/backtest_restantes_uf.py'
      - 'experimentos/modelo_999/auditar_modelo_restantes.py'
      - 'experimentos/modelo_999/testar_transferencias_secoes.py'
      - 'experimentos/modelo_999/matriz_transferencias_categorias.py'
      - 'experimentos/modelo_999/reconciliar_hierarquia_secoes.py'
      - 'experimentos/modelo_999/diagnosticar_base_integral_secoes.py'
      - 'experimentos/modelo_999/auditar_integracao_candidatos.py'
      - 'experimentos/modelo_999/diagnosticar_perdas_finalistas.py'
      - 'experimentos/modelo_999/fluxos_comparecimento_abstencao.py'
      - 'experimentos/modelo_999/investigar_aptos_divergentes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backtest temporal nacional
        run: python3 experimentos/modelo_999/backtest_baseline_nacional.py
      - name: Auditar sincronismo temporal por UF
        run: python3 experimentos/modelo_999/auditar_sincronismo_uf.py
      - name: Auditar defasagem temporal dos estados
        run: python3 experimentos/modelo_999/auditar_staleness_uf.py
      - name: Executar nowcast territorial por UF
        run: python3 experimentos/modelo_999/backtest_nowcast_uf.py
      - name: Inspecionar variaveis do primeiro turno
        run: python3 experimentos/modelo_999/diagnosticar_primeiro_turno.py
      - name: Backtest com dados historicos do primeiro turno
        run: python3 experimentos/modelo_999/backtest_primeiro_turno_uf.py
      - name: Testar robustez do modelo historico
        run: python3 experimentos/modelo_999/stress_primeiro_turno_uf.py
      - name: Backtest dos votos restantes por UF
        run: python3 experimentos/modelo_999/backtest_restantes_uf.py
      - name: Auditar comparativo e faixas criticas
        run: python3 experimentos/modelo_999/auditar_modelo_restantes.py
      - name: Limites ecologicos de transferencia por secao
        run: python3 experimentos/modelo_999/testar_transferencias_secoes.py
      - name: Matriz completa de categorias e abstenções
        run: python3 experimentos/modelo_999/matriz_transferencias_categorias.py
      - name: Reconciliar hierarquia secao municipio UF nacional
        run: python3 experimentos/modelo_999/reconciliar_hierarquia_secoes.py
      - name: Diagnosticar bases integrais de secoes e candidatos
        run: python3 experimentos/modelo_999/diagnosticar_base_integral_secoes.py
      - name: Auditar integracao nacional de candidatos por secao
        run: python3 experimentos/modelo_999/auditar_integracao_candidatos.py
      - name: Diagnosticar perdas dos finalistas por urna
        run: python3 experimentos/modelo_999/diagnosticar_perdas_finalistas.py
      - name: Auditar movimentos bidirecionais de abstencao
        run: python3 experimentos/modelo_999/fluxos_comparecimento_abstencao.py
      - name: Investigar divergencias no eleitorado apto
        run: python3 experimentos/modelo_999/investigar_aptos_divergentes.py
      - name: Publicar resultados como artefato independente do push
        uses: actions/upload-artifact@v4
        with:
          name: backtest-baseline-nacional
          path: experimentos/modelo_999/resultados/*.json
          if-no-files-found: error
      - name: Registrar resultados na branch experimental (tentativa tolerante a falha de rede)
        continue-on-error: true
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add experimentos/modelo_999/resultados/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar resultados do baseline nacional"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Tentativa $attempt falhou; aguardando antes de tentar novamente"
              sleep $((attempt * 10))
            done
            echo "Push indisponivel; resultado preservado no artefato do workflow"
            exit 1
          fi
