name: Backtest baseline nacional isolado
on:
  push:
    branches: [experimento/modelo-territorial-999]
    paths:
      - '.github/workflows/backtest-baseline-999.yml'
      - 'experimentos/modelo_999/backtest_baseline_nacional.py'
      - 'experimentos/modelo_999/auditar_sincronismo_uf.py'
      - 'experimentos/modelo_999/auditar_staleness_uf.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backtest temporal nacional
        run: python3 experimentos/modelo_999/backtest_baseline_nacional.py
      - name: Auditar sincronismo temporal por UF
        run: python3 experimentos/modelo_999/auditar_sincronismo_uf.py
      - name: Auditar defasagem temporal dos estados
        run: python3 experimentos/modelo_999/auditar_staleness_uf.py
      - name: Publicar resultados como artefato independente do push
        uses: actions/upload-artifact@v4
        with:
          name: backtest-baseline-nacional
          path: experimentos/modelo_999/resultados/*.json
          if-no-files-found: error
      - name: Registrar resultados na branch experimental (tentativa tolerante a falha de rede)
        continue-on-error: true
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add experimentos/modelo_999/resultados/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar resultados do baseline nacional"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Tentativa $attempt falhou; aguardando antes de tentar novamente"
              sleep $((attempt * 10))
            done
            echo "Push indisponivel; resultado preservado no artefato do workflow"
            exit 1
          fi
