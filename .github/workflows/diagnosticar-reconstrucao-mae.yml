name: Diagnosticar dados para MAE individual
on:
  push:
    branches: [experimento/reconstrucao-mae-indicadores]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/diagnosticar-reconstrucao-mae.py
      - name: Publicar diagnóstico na branch experimental
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add dados/2026/diagnostico-esquemas-reconstrucao.json
          git commit -m "Registrar esquemas para reconstrução MAE" || exit 0
          git push
