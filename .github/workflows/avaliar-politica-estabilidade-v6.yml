name: V6 - politica conservadora de estabilidade
on:
  push:
    branches: [experimento/modelo-territorial-999]
    paths:
      - 'experimentos/modelo_999/auditoria_integral/preditor_v6_estavel.py'
      - 'experimentos/modelo_999/auditoria_integral/avaliar_politica_estabilidade_v6.py'
      - '.github/workflows/avaliar-politica-estabilidade-v6.yml'
  workflow_dispatch:
jobs:
  stability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify stability and abstention policy
        run: python experimentos/modelo_999/auditoria_integral/avaliar_politica_estabilidade_v6.py
      - name: Publish full decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-politica-estabilidade
          path: experimentos/modelo_999/auditoria_integral/resultado_politica_estabilidade_v6.json
          if-no-files-found: warn
