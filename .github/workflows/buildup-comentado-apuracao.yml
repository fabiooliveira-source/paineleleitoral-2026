name: Validar buildup comentado
on:
  push:
    branches: [feature/buildup-comentado-apuracao]
  pull_request:
    paths: ['index.html', 'buildup-comentado-apuracao.js']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check buildup-comentado-apuracao.js
      - run: node tests/limites-por-urna.cjs
